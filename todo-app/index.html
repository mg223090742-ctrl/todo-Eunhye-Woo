<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할 일 목록</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>우은혜의 할 일 목록</h1>
    <p class="subtitle">우은혜의 할 일</p>

    <form id="todo-form" class="todo-form">
      <input id="author-input" class="author-input" type="text" placeholder="이름(선택)" autocomplete="off">
      <input id="todo-input" type="text" placeholder="할 일을 입력하세요" autocomplete="off" autofocus>
      <button type="submit">추가</button>
    </form>

    <p id="error-message" class="error-message" hidden></p>

    <ul id="todo-list" class="todo-list"></ul>
    <p id="empty-message" class="empty-message">할 일이 없습니다 🎉</p>
  </main>

  <!-- Supabase에 접속하는 도구 → 접속 정보 → 앱 순서로 불러온다 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
